[project]
name = "k12-teaching-harness"
version = "0.1.0"
description = "文件化数学课程设计 Harness"
requires-python = ">=3.12,<3.14"
dependencies = [
  "langchain==1.4.0",
  "langchain-google-genai>=4.2,<5",
  "langgraph==1.2.11",
  "langgraph-cli[inmem]==0.4.31",
  "langgraph-sdk==0.4.4",
  "httpx>=0.28,<0.29",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.2,<2",
  "fastapi>=0.135,<1",
  "langgraph-api==0.14.1",
  "markdown-it-py==4.0.0",
  "mdit-py-plugins>=0.5,<0.7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "mypy>=1.19,<2", "ruff>=0.15,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teaching_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
files = ["src/teaching_harness"]
check_untyped_defs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
