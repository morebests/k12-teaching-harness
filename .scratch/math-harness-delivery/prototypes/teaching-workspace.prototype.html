<header class="top"><div class="top-inner"><button class="brand" data-action="home">数学课程工作区</button><div class="toolbar"><button data-action="new">新建课程设计</button><button data-action="independent">独立教学任务</button><button data-action="tasks" id="tasks-toggle">我的任务</button></div></div></header>
<div class="prototype-note"><span>交互原型 · 模拟数据与执行 · 刷新后重置</span><details><summary>样本说明</summary><p>全年目录节选自已有原创实验；单元内计划、三课材料及修订结果为合成的交互样本。未连接模型、知识服务或后端。任意输入会保留原文，只有明确的演示文本或演示操作会推进预置结果。所有条件均为演示设定，不代表真实学校或学生。IM 仅用作页面布局参考。</p></details></div>

<script>
'use strict';
// Static interaction fixtures. No model, knowledge query or production workflow.
const units=[
 {id:1,title:'刚性变换与全等',periods:16,goal:'通过平移、旋转与反射描述图形关系。',codes:'8.G.A.1–3'},
 {id:2,title:'位似、相似与斜率',periods:18,goal:'连接几何中的相似关系与直线的恒定变化率。',codes:'8.G.A.4–5 · 8.EE.B.5–6'},
 {id:3,title:'一元一次方程',periods:16,goal:'理解等价变形，解释方程解的不同情况。',codes:'8.EE.C.7'},
 {id:4,title:'函数的基本概念',periods:14,goal:'用不同表征描述输入和输出，比较函数性质。',codes:'8.F.A.1–3'},
 {id:5,title:'线性函数与情境建模',periods:18,goal:'从两组对应值建立线性模型，解释变化率与初始值。',codes:'8.F.B.4–5'},
 {id:6,title:'二元一次方程组',periods:18,goal:'连接两种关系，解释共同解及其情境意义。',codes:'8.EE.C.8'},
 {id:7,title:'实数与勾股定理',periods:22,goal:'理解无理数，用几何关系推理长度与距离。',codes:'8.NS.A · 8.EE.A.2 · 8.G.B'},
 {id:8,title:'指数、科学记数法与体积',periods:20,goal:'比较数量级，并在空间问题中使用数量关系。',codes:'8.EE.A.1、3–4 · 8.G.C.9'},
 {id:9,title:'双变量数据与关联',periods:18,goal:'用图表与模型描述数据关联，解释模型的局限。',codes:'8.SP.A'}
];
const sections=[
 {id:'A',title:'从情境识别两个量的变化',start:1,end:5,goal:'比较表格、语言与图形，辨认变化率和起始状态。'},
 {id:'B',title:'由对应值建立线性模型',start:6,end:8,goal:'先比较变化，再回推初始值，最后用多种表征解释与检验模型。'},
 {id:'C',title:'解释、比较与检验模型',start:9,end:14,goal:'在不同情境与表征之间迁移，检验模型对问题的解释。'},
 {id:'D',title:'整合、迁移与学习检查',start:15,end:18,goal:'独立建模、说明假设，并以学习证据检验目标。'}
];
const lessonNames=['情境中的两个量','读懂表格与变化','描述图形中的变化','变化率的单位','初始状态与条件','用两组数据求变化率','把表、式与图连起来','比较两种收费方案','从描述建立模型','解释参数的情境意义','换一种表征检验','模型什么时候适用','定性描述图形','比较不同模型','在新情境中建模','解释与质疑方案','整合练习','单元学习检查'];
const coreTask='A bike rental charges a fixed starting fee and a constant fee per hour. Renting for 2 hours costs $12; renting for 5 hours costs $21. What is the hourly fee? What is the starting fee? Explain your reasoning using both observations.';
const prepSample='每小时 3 美元，起步费 6 美元。接近正确的回应是“每小时 3 美元，所以 C = 3h”，它遗漏了固定起步费。';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=x=>JSON.parse(JSON.stringify(x));
const initial={rev:1,timings:{6:{discussion:10,practice:20},7:{discussion:10,practice:20},8:{discussion:10,practice:20}},lessonNotes:{},taskNotes:{},bridging:false,materialMinutes:50,contextMinutes:50,contextNotes:'纸笔、方格纸、投影；不要求每名学生都有设备。',changes:[],reason:'初始交互样本',contextChanged:false};
const state={route:{type:'year',unit:5,section:'B',lesson:6,tab:'overview'},versions:[initial],viewRev:null,panel:null,activeTask:null,tasks:[],drawer:false,serial:0,formDrafts:{},newTitle:'八年级数学',creationDrafts:{},navCollapsed:false,navOpen:{},notice:''};
const latest=()=>state.versions[state.versions.length-1];
const snapshot=()=>state.viewRev?state.versions.find(v=>v.rev===state.viewRev)||latest():latest();
const isOld=()=>snapshot().rev!==latest().rev;
const sectionFor=n=>sections.find(s=>n>=s.start&&n<=s.end);
const ready=n=>[6,7,8].includes(Number(n));
const unitFor=()=>units.find(u=>u.id===Number(state.route.unit))||units[4];
function button(label,action,value='',cls=''){return '<button class="'+cls+'" data-action="'+action+'"'+(value!==''?' data-value="'+esc(value)+'"':'')+'>'+label+'</button>';}
function chip(text,warn=false){return '<span class="chip'+(warn?' warn':'')+'">'+text+'</span>';}
function announce(text){document.querySelector('#announcement').textContent=text;}
function routeName(r=state.route){if(r.type==='year'||r.type==='new')return '八年级全年方案';if(r.type==='unit')return '单元 '+r.unit+' · '+units[r.unit-1].title;if(r.type==='section')return '单元 5 · 课段 '+r.section;if(r.type==='lesson')return '单元 5 · 第 '+r.lesson+' 课';return '独立教学任务';}
function go(type,value,tab='overview'){
 if(type==='unit')state.route={type,unit:Number(value),section:'B',lesson:6,tab};
 else if(type==='section')state.route={type,unit:5,section:value,lesson:sections.find(s=>s.id===value).start,tab};
 else if(type==='lesson')state.route={type,unit:5,section:sectionFor(Number(value)).id,lesson:Number(value),tab};
 else state.route={type,unit:5,section:'B',lesson:6,tab};
 if(['unit','section','lesson'].includes(type)&&state.route.unit===5)state.navOpen['unit-5']=true;if(['section','lesson'].includes(type))state.navOpen['section-'+state.route.section]=true;
 state.notice='';render();document.querySelector('#content').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});
}
function commit(reason,patch,changes){const v={...clone(latest()),...patch,rev:latest().rev+1,reason,changes};state.versions.push(v);state.viewRev=null;return v;}
function head(title,sub,actionHTML=''){return '<div class="page-head"><h1>'+title+'</h1><div class="actions">'+actionHTML+'</div></div><p class="subtitle">'+sub+'</p>';}
function meta(){return '<div class="meta">'+button('工作版本 v'+snapshot().rev,'versions','','small')+button('条件与依据','context','','small')+chip('CCSS 数学')+(snapshot().contextChanged?chip('教学条件已改，材料待复核',true):'')+'</div>';}
function localAction(scope){return isOld()?'':button('修改这一部分','revise',scope,'quiet small');}
function sectionHead(title,scope){return '<div class="section-head"><h2>'+title+'</h2>'+localAction(scope)+'</div>';}
function changesNotice(){return snapshot().changes.length?'<div class="change"><b>本版改动：</b>'+snapshot().changes.map(esc).join('；')+'。'+button('查看版本记录','versions','','quiet small')+'</div>':'';}

 return '<section class="section"><h2>目标分配与学习机会</h2><p class="subtitle">以下是全年候选中的标准分配摘要。分配到计划与形成实际学习机会分别核对。</p><div class="table-wrap"><table><thead><tr><th>CCSS 范围</th><th>承担单元</th><th>当前材料</th></tr></thead><tbody>'+units.map(u=>'<tr><td>'+u.codes+'</td><td>'+button(u.title,'unit',u.id,'quiet small')+'</td><td>'+(u.id===5?'三课交互样本':'只有单元概览')+'</td></tr>').join('')+'</tbody></table></div><h3>数学实践</h3><p class="reading">全年设计同时考虑 MP1–MP8。实践目标必须落实到学生实际做的推理、建模、解释与检验中；原型仅演示其呈现位置，未进行完整覆盖检查。</p><div class="info">实际知识身份、原文和关系由本地 Learning Commons 提供。本页没有查询 LC，也不展示虚构的覆盖分数。</div></section>';

function yearPage(){

function plot(compare=false){
 let svg='<svg class="plot" role="img" aria-labelledby="plot-title plot-desc" viewBox="0 0 500 300"><title id="plot-title">Rental cost and time</title><desc id="plot-desc">Horizontal axis: time in hours, from zero to six. Vertical axis: cost in dollars, from zero to thirty. Rental A costs three dollars per hour plus a six-dollar starting fee.'+(compare?' Rental B costs five dollars per hour. They meet at three hours and fifteen dollars.':'')+'</desc>';
 for(let y=0;y<=30;y+=6)svg+='<path d="M50 '+(240-y*6)+'H420" stroke="#dbe3dc" fill="none"/><text x="40" y="'+(245-y*6)+'" text-anchor="end" font-size="13" fill="#33483b">'+y+'</text>';
 for(let x=0;x<=6;x++)svg+='<path d="M'+(50+x*60)+' 60V240" stroke="#e4eae4" fill="none"/><text x="'+(50+x*60)+'" y="260" text-anchor="middle" font-size="13" fill="#33483b">'+x+'</text>';
 svg+='<path d="M50 50V240H430" fill="none" stroke="#33483b" stroke-width="1.5"/><path d="M50 204L410 96" fill="none" stroke="#256149" stroke-width="3"/><text x="12" y="29" font-size="14" fill="#22352f">Cost ($)</text><text x="345" y="286" font-size="14" fill="#22352f">Time (hours)</text>';
 if(compare)svg+='<path d="M50 240L410 60" fill="none" stroke="#79552b" stroke-width="2.5" stroke-dasharray="8 5"/><text x="430" y="101" font-size="13" fill="#256149">A</text><text x="430" y="64" font-size="13" fill="#79552b">B</text>';
 else svg+='<circle cx="170" cy="168" r="4" fill="#256149"/><text x="110" y="148" font-size="13" fill="#22352f">(2, 12)</text><circle cx="350" cy="114" r="4" fill="#256149"/><text x="313" y="98" font-size="13" fill="#22352f">(5, 21)</text>';
 return svg+'</svg>';
}
function lessonOverview(n){

 return '<section class="section">'+sectionHead('本课目标与衔接','lesson-narrative')+'<div class="reading"><p>'+['根据两组对应值求变化率，解释单位，并由一点回推初始值。','用同一组租车数据连接表、式与图，说明参数在不同表征中的意义。','比较带起步费与无起步费的方案，用数据和图解释选择。'][n-6]+'</p><p>'+['入口：已能读表、计算数值差和识别单位。后续：把计算与图形、式子连接。','入口：前一课得到每小时费用与起步费。后续：用模型比较方案。','入口：前两课连接了变化率、初始值和表征。后续：在新情境中独立建模。'][n-6]+'</p></div></section><section class="section">'+sectionHead('核心任务','lesson-task')+'<div class="task-text" lang="en">'+coreTask+'</div><p class="muted">原型的共享任务样本。学生页、教师指南与备课使用同一原题。</p></section><section class="section">'+sectionHead('课堂安排','lesson-timing')+timingTable()+'</section><section class="section"><h2>围绕这节课继续工作</h2><div class="actions">'+button('课时与材料设计','create',n)+button('教学适配','adapt',n)+button('教师备课','prep',n)+button('理解度检查','cfu',n)+'</div></section>';

function studentMaterials(n){
 let questions=n===6?'<li>Find the hourly fee. Show how the changes in cost and time are related.</li><li>Find the starting fee. Explain why 12 ÷ 2 is not the hourly fee.</li>':n===7?'<li>Write a rule for cost C after h hours. Explain what each number means.</li><li>Explain how the table, rule and graph describe the same relationship.</li>':'<li>Rental B has no starting fee and costs $5 per hour. Which rental would you choose for 1, 3 and 5 hours? Explain.</li><li>When do the two rentals cost the same? Use two representations to justify your answer.</li>';
 return '<article class="student-page" lang="en"><h2>'+['Rates and starting fees','One relationship, three representations','Comparing rental plans'][n-6]+'</h2><p>Name: ____________________　Date: __________</p><div class="task-text">'+coreTask+'</div>'+(n===7?'<div class="table-wrap"><table><caption>Rental A</caption><thead><tr><th>Time (hours)</th><th>Cost ($)</th></tr></thead><tbody><tr><td>2</td><td>12</td></tr><tr><td>5</td><td>21</td></tr></tbody></table></div>':'')+(n>6?plot(n===8):'')+'<ol>'+questions+'</ol>'+(snapshot().taskNotes[n]?'<p>'+esc(snapshot().taskNotes[n])+'</p>':'')+'<p>Show your reasoning. Include units where appropriate.</p><div class="answer-space"></div><div class="answer-space"></div><div class="answer-space"></div></article>';
}
function teacherGuide(n){
 return '<section class="section">'+sectionHead('解法与讨论','lesson-guide')+'<div class="reading"><p>变化率：(21 − 12) ÷ (5 − 2) = 3 美元／小时。初始值：12 − 3 × 2 = 6 美元。收费关系为 C = 3h + 6。</p><p>请学生说明为什么要比较两个量的变化，再将关系代回两组数据检验。总费用除以小时数会将固定费用也平均分配。</p>'+(n===8?'<p>另一方案 C = 5h。在 3 小时时均为 15 美元；较短时长选择 B，较长时长选择 A。比较应保留相同时间与单位。</p>':'')+'<p>讨论用 '+lessonTiming(n).discussion+' 分钟。对“C = 3h”这样的回应，让学生检查两组条件是否成立，再解释固定差额。它是教学预案，不能当作已经发生的学生错误。</p></div></section><section class="section"><h2>时间与学习检查</h2>'+timingTable()+'<p class="reading">离堂任务样本：某服务在 1 小时时收费 10 美元，4 小时时收费 22 美元，按恒定费率收费。解释每小时费用和起步费。教师参考：4 美元／小时、起步费 6 美元。</p></section>';
}

function taskSeed(kind,scope){
 if(kind==='year')return '设计八年级数学全年方案，分配目标、单元职责和课时，说明各单元的前后衔接。';
 if(kind==='revise'&&scope==='lesson-task')return '在本课任务后补充：请用两组数据说明理由，并标明单位。';
 if(kind==='revise'&&scope==='lesson-narrative')return '补充本课与前后课的衔接说明，保持目标与课时不变。';
 if(kind==='revise')return scope==='lesson-timing'||scope==='lesson'||scope==='lesson-guide'?'把全班讨论增加五分钟，从迁移练习中调配，保持本课总时长不变。':'请核查课段 B 中表格、式与图的学习衔接，在现有课时范围内补充说明并同步相关层级。';
 if(kind==='create')return '先给我看这节变化率与初始值的课时草稿，总共 50 分钟。';
 if(kind==='adapt')return '沿用租车原题，根据演示观察增加比较两个量变化的支持和一个拓展，生成后让我审阅。';
 if(kind==='prep')return '帮我准备这道租车题，先让我自己尝试，再讨论接近正确但仍有缺口的回应。';
 if(kind==='cfu')return '设计一个变化率的理解度检查，帮助我确定下一节课需要补充什么。';
 return '展开这个单元的课段进程，并为第 6–8 课生成可审阅的材料。';
}
function startTask(kind,scope='',route=state.route,seedOverride){
 if(isOld()){announce('正在查看旧版本，请先返回当前版本。');return;}
 const t={id:++state.serial,kind,scope,route:clone(route),base:latest().rev,status:'draft',stage:'start',label:({year:'全年课程设计',revise:'局部修订',create:'课时与材料',adapt:'教学适配',prep:'教师备课',cfu:'理解度检查',unit:'单元设计'})[kind]||'课程设计',seed:seedOverride||taskSeed(kind,scope),draft:seedOverride||taskSeed(kind,scope),history:[],message:'',progress:'',partial:false,contribution:'',resultRev:null,phase:0};
 state.tasks.push(t);state.activeTask=t.id;state.panel='task';render();focusPanel();
}
function currentTask(){return state.tasks.find(t=>t.id===state.activeTask);}
function focusPanel(){const el=document.querySelector('#panel h2');if(el){el.tabIndex=-1;el.focus({preventScroll:true});}if(window.innerWidth<1100)document.querySelector('#panel').scrollIntoView({block:'start',behavior:'instant'});}
function revealTask(t){
 if(!['create','adapt','prep','cfu'].includes(t.kind)||state.activeTask!==t.id||state.panel!=='task')return;
 const r=state.route, origin=t.route;
 if(r.type==='task'||r.type===origin.type&&r.unit===origin.unit&&r.lesson===origin.lesson)state.route={type:'task',unit:origin.unit,section:origin.section,lesson:origin.lesson,tab:'overview'};
}
function simulate(t,phases,finish){
 t.status='running';t.phases=phases;t.finish=finish;t.phase=0;t.progress=phases[0];t.message='';render();announce('开始模拟执行：'+t.label);
 const step=()=>{if(t.status!=='running')return;t.phase++;if(t.phase<phases.length){t.progress=phases[t.phase];render();t.timer=setTimeout(step,1100);}else{if(t.base!==latest().rev&&['revise','create'].includes(t.kind)){t.status='cancelled';t.message='执行期间内容已变更，结果未写入。请在当前版本重新发起工作。';render();announce(t.message);return;}finish();revealTask(t);t.progress='';render();announce(t.label+'：'+statusLabel(t));}};
 t.step=step;t.timer=setTimeout(step,1100);
}
function taskStart(t){
 if(t.route.type==='unit'&&t.route.unit!==5||t.route.type==='lesson'&&!ready(t.route.lesson)){
  t.message='需求已记录。本原型只展开单元 5 的第 6–8 课，其余内容尚无演示结果。';return;
 }
 if(t.kind==='create'){simulate(t,['正在组织本课任务','正在准备可审阅草稿'],()=>{t.status='waiting';t.stage='creation-draft';});return;}
 if(t.kind==='prep'){simulate(t,['正在读取原题与备课目标','正在准备本次讨论'],()=>{t.status='waiting';t.stage='prep-try';});return;}
 if(t.kind==='cfu'){simulate(t,['正在明确本次检查范围'],()=>{t.status='waiting';t.stage='cfu-focus';});return;}
 if(t.kind==='adapt'){simulate(t,['正在核对原课与支持需要','正在组织支持与拓展材料'],()=>{t.status='waiting';t.stage='adapt-review';});return;}
 if(t.kind==='revise'){
  simulate(t,['正在核对当前对象与版本','正在整理修改及影响','正在记录对应版本的待复核项'],()=>{
   const n=t.route.lesson||6; let patch,changes,reason;
   if(t.scope==='lesson-task'){patch={taskNotes:{...latest().taskNotes,[n]:'Use both observations to explain your reasoning. Label the units.'}};changes=['第 '+n+' 课任务说明'];reason='补充当前任务的作答说明';}
   else if(t.scope==='lesson-narrative'){patch={lessonNotes:{...latest().lessonNotes,[n]:'本课先沿用两组对应值解释变化，再将结果交给后续课时连接表、式与图；目标与课时保持。'}};changes=['第 '+n+' 课衔接说明'];reason='补充本课前后衔接';}
   else if(t.scope.startsWith('lesson')){patch={timings:{...clone(latest().timings),[n]:{discussion:15,practice:15}}};changes=['第 '+n+' 课讨论 10 → 15 分钟','本课迁移练习 20 → 15 分钟；其他课时未改'];reason='调整本课讨论与练习时间';}
   else{patch={bridging:true};changes=['课段 B 的表征衔接说明','单元 5 与全年摘要','第 6–8 课列入复核范围'];reason='补充表征衔接';}
   const v=commit(reason,patch,changes);t.status='done';t.stage='result';t.resultRev=v.rev;t.message='演示修订已形成工作版本 v'+v.rev+'。实际检查尚未运行，公共课程基线尚未采用。';
  });return;
 }

 simulate(t,['正在整理本次目标与条件','正在组织课程进程','正在整理方案与未完成内容'],()=>{t.status='done';t.stage='result';t.resultRev=latest().rev;t.message='已载入全年与单元的演示方案。其他单元仍只有概览；本次没有真实模型生成或质量验证。';if(state.route.type==='new')state.route={type:'year',unit:5,section:'B',lesson:6,tab:'overview'};});
}
function statusLabel(t){return ({draft:'待提交',running:'执行中 · 模拟',waiting:'需要你的回应',done:'本次演示结束',stopped:'已停止，可续作',cancelled:'已取消'})[t.status]||t.status;}
function reply(t,action,text){
 t.history.push(text);t.message='';
 if(action==='creation-only'){t.draftTiming={discussion:15,practice:15};t.draftRev=(t.draftRev||1)+1;t.message='草稿 d'+t.draftRev+' 已修改；已有材料保持原版，仍等待生成指令。';t.stage='creation-draft';return;}
 if(action==='creation-generate'){
  simulate(t,['正在沿当前草稿组织师生材料','正在演示材料检查与结果交接'],()=>{
   const n=t.route.lesson||6;
   const v=commit('根据当前草稿形成材料样本',{timings:{...clone(latest().timings),[n]:t.draftTiming||lessonTiming(n)}},['第 '+n+' 课师生材料样本']);
   t.status='done';t.stage='creation-result';t.resultRev=v.rev;t.message='已载入当前草稿对应的材料样本；实际材料验证尚未运行。';
  });return;
 }
 if(action==='creation-revise-generate'){t.draftTiming={discussion:15,practice:15};reply(t,'creation-generate','按修改后的草稿生成材料。');return;}
 if(action==='adapt-partial'){t.partial=true;t.message='已记录支持任务的接受；教师说明与拓展仍待审阅。';return;}
 if(action==='adapt-all'){t.status='done';t.stage='adapt-result';t.message='已接受当前整个演示材料包，本次协作结束。';return;}
 if(action==='end'){t.status='done';t.stage=t.kind==='prep'?'prep-notes':t.stage;t.message=t.kind==='prep'?'已按本次讨论形成备课便签。':'按明确要求结束；未审阅部分不记为已接受。';return;}
 if(action==='prep-contribution'||action==='prep-example'){
  t.contribution=action==='prep-contribution'?text:'';t.status='waiting';t.stage='prep-discussion';t.message=action==='prep-example'?'按要求先提供系统示例，未记为教师自己提出。':'演示回应已采纳；下方讨论保留了具体贡献。';return;
 }
 if(action==='cfu-accept'||action==='cfu-open'){
  t.openResponse=action==='cfu-open';simulate(t,['正在构建学生页与教师指南','正在演示学生独立读题检查','正在演示错误推理与作答核对'],()=>{t.status='done';t.stage='cfu-result';t.message='两道验证的顺序已演示。没有执行真实验证，不能据此判断材料质量。';});return;
 }
}
function submitTask(){
 const t=currentTask();const input=document.querySelector('#task-input');if(!t||!input)return;
 const text=input.value.trim();t.draft=text;if(!text){t.message='请先写下需求或回应。';render();return;}
 if(t.base!==latest().rev&&t.status!=='draft'){t.history.push(text);t.message='你回应的是 v'+t.base+'，当前工作版本已变更。原文已保存，请核对新内容后重新发起相应工作。';render();return;}
 if(t.stage==='start'){
  t.history.push(text);
  if(text!==t.seed){t.message='原文已保存，尚未解释或采纳。静态原型不能处理任意自然语言；可载入演示文本继续走查。';render();return;}
  taskStart(t);
 }else if(t.stage==='prep-try'&&text===prepSample)reply(t,'prep-contribution',text);
 else{t.history.push(text);t.message='原文已保存，尚未解释或采纳。可使用当前明确动作继续演示；正式系统由模型理解自然语言。';}
 render();
}
function controls(t){
 if(t.status==='cancelled')return '<div class="notice">本任务已取消。已有内容与输入记录保留，迟到结果不会提交。</div>';
 if(t.status==='stopped')return '<div class="notice">模拟执行已停止，已有内容保留。</div><div class="actions">'+button('从保存位置继续','resume-task','','primary')+'</div>';
 if(t.status==='running')return '<div class="status-line running" role="status"><span class="dot"></span><span>'+esc(t.progress)+'</span></div><p class="muted">正在播放执行过程的模拟状态。</p><div class="actions">'+button('停止并保留','stop-task')+button('取消任务','cancel-task','','quiet')+'</div>';
 let body='';
 if(t.stage==='start')body='<div class="field"><label for="task-input">需求与修改要求</label><textarea id="task-input">'+esc(t.draft)+'</textarea></div><div class="actions">'+button('提交需求','send-task','','primary')+(t.kind==='create'&&(t.route.type==='independent'||ready(t.route.lesson))?button('直接生成材料','reply-action','creation-generate'):'')+(t.kind==='cfu'?button('按已有变化率焦点生成','reply-action','cfu-accept'):'')+'</div>';
 if(t.stage==='creation-draft')body='<div class="request"><h3>请看当前课时草稿</h3><p>下方主内容已显示原题和 '+snapshot().materialMinutes+' 分钟的安排。只改草稿与改后生成按你的意图分别处理。</p></div><div class="actions">'+button('只改草稿：讨论增加 5 分钟','reply-action','creation-only')+button('改好并生成材料','reply-action','creation-revise-generate','primary')+button('按当前草稿生成','reply-action','creation-generate')+'</div>';
 if(t.stage==='adapt-review')body='<div class="request"><h3>审阅当前适配包</h3><p>本次包含支持任务、拓展任务与教师说明。'+(t.partial?'支持已接受，另外两部分待审阅。':'请分别判断需要修改的部分。')+'</p></div><div class="actions">'+button('支持可以，其余待审','reply-action','adapt-partial')+button('接受当前整套材料','reply-action','adapt-all','primary')+button('先结束，稍后再审','reply-action','end','quiet')+'</div>';
 if(t.stage==='prep-try')body='<div class="request"><h3>先试做，再分析一种回应</h3><p>请阅读下方原题，给出你的解法，再描述一个接近正确但仍有关键缺口的学生回应。</p></div><div class="field"><label for="task-input">你的尝试与分析</label><textarea id="task-input" placeholder="写下你的解法，以及你想讨论的学生思考">'+esc(t.draft===t.seed?'':t.draft)+'</textarea></div><div class="actions">'+button('提交尝试','send-task','','primary')+button('请先给我示范','reply-action','prep-example')+button('结束备课','reply-action','end','quiet')+'</div>';
 if(t.stage==='prep-discussion')body='<div class="request"><h3>继续讨论或整理便签</h3><p>本次讨论围绕原题和已提供的贡献展开。</p></div><div class="actions">'+button('整理为备课便签','reply-action','end','primary')+'</div>';
 if(t.stage==='cfu-focus')body='<div class="request"><h3>确定本次检查焦点</h3><p>根据两组对应值求变化率、解释单位，并区分变化之比与单点比值。</p><p>先固定这个焦点，再构建实际学生页与教师指南。</p></div><div class="actions">'+button('采用这个焦点','reply-action','cfu-accept','primary')+button('采用焦点，要求写出推理','reply-action','cfu-open')+'</div>';
 if(t.status==='done'){
  body+='<div class="actions">'+button('回到相关内容','task-origin','','primary')+'</div>';
  if(t.kind==='cfu'||t.kind==='adapt'||t.kind==='prep')body+=button('查看本次结果','task-result','','quiet');
 }
 if(t.status==='waiting'&&!['prep-try'].includes(t.stage))body+='<div class="field"><label for="task-input">也可以用文字回应</label><textarea id="task-input" placeholder="补充意见或提出修改">'+esc(t.draft===t.seed?'':t.draft)+'</textarea></div><div class="actions">'+button('发送文字回应','send-task')+'</div>';
 if(t.status==='waiting')body+='<div class="actions">'+button('取消本次工作','cancel-task','','quiet')+'</div>';
 return body;
}

function curriculumTree(){

   for(let n=sec.start;n<=sec.end;n++)html+=link('第 '+n+' 课 · '+lessonNames[n-1],'lesson',n,r.type==='lesson'&&r.lesson===n,ready(n)?'材料样本':'仅有规划');

 let crumb=button('课程目录','directory','','small');
 if(r.type!=='independent')crumb+='<span class="sep" aria-hidden="true">/</span>'+button('八年级数学','home','','quiet');
 if(['unit','section','lesson'].includes(r.type))crumb+='<span class="sep" aria-hidden="true">/</span>'+button('单元 '+r.unit,'unit',r.unit,'quiet');
 if(['section','lesson'].includes(r.type))crumb+='<span class="sep" aria-hidden="true">/</span>'+button('课段 '+r.section,'section',r.section,'quiet');
 if(r.type==='lesson')crumb+='<span class="sep" aria-hidden="true">/</span><span class="current">第 '+r.lesson+' 课</span>';
 if(['independent','new','task'].includes(r.type))crumb+='<span class="sep" aria-hidden="true">/</span><span class="current">'+({independent:'独立教学任务',new:'新建设计',task:'教学工作'})[r.type]+'</span>';
 if(actualRoute.type==='task')crumb+='<span class="sep" aria-hidden="true">/</span><span class="current">'+esc(currentTask().label)+'</span>';
 document.querySelector('#crumbs').innerHTML=crumb;
 let body=({year:yearPage,unit:unitPage,section:sectionPage,lesson:lessonPage,new:newPage,independent:independentPage,task:()=>{const t=currentTask();return t?head(t.label,routeName(t.route)+' · 本次任务基于 v'+t.base)+taskResultBody(t):independentPage();}})[actualRoute.type]();
 if(isOld())body='<div class="old-banner">正在查看历史工作版本 v'+snapshot().rev+'，修改请返回当前版本。'+button('返回当前版本','current-version','','small')+'</div>'+body;
 if(state.notice)body='<div class="info" role="status">'+esc(state.notice)+'</div>'+body;
 document.querySelector('#content').innerHTML=body;renderPanel();renderCourseNav();
 for(const id of formIds){const el=document.getElementById(id);if(el&&!el.disabled&&Object.hasOwn(state.formDrafts,id))el.value=state.formDrafts[id];}
 const pending=state.tasks.filter(t=>['running','waiting','stopped'].includes(t.status)).length;document.querySelector('#tasks-toggle').textContent='我的任务'+(pending?' · '+pending:'');
}
let directoryReturn=null;
function showDirectory(){
 directoryReturn=document.activeElement;const d=document.querySelector('#directory');d.hidden=false;state.drawer=true;
 d.innerHTML='<div class="drawer-inner"><div class="drawer-head"><h2 id="directory-title">课程目录</h2>'+button('关闭目录','close-directory','','small')+'</div>'+curriculumTree()+'</div>';
 d.querySelector('button').focus();document.body.style.overflow='hidden';
}
function hideDirectory(){document.querySelector('#directory').hidden=true;state.drawer=false;document.body.style.overflow='';if(directoryReturn&&directoryReturn.isConnected)directoryReturn.focus();}
document.addEventListener('toggle',e=>{if(e.target.matches('details[data-tree-key]')&&e.target.isConnected)state.navOpen[e.target.dataset.treeKey]=e.target.open;},true);
document.addEventListener('input',e=>{if(e.target.id==='task-input'){const t=currentTask();if(t)t.draft=e.target.value;}});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value||'';const t=currentTask();
 if(a==='home')return go('year');
 if(a==='unit'||a==='section'||a==='lesson')return go(a,v);
 if(a==='tab'){state.route.tab=v;render();return;}
 if(a==='new'){state.panel=null;return go('new');}
 if(a==='independent'){state.panel=null;return go('independent');}
 if(a==='directory'){if(window.innerWidth>=1000){state.navCollapsed=false;render();document.querySelector('#course-nav button').focus();return;}return showDirectory();}
 if(a==='collapse-nav'){state.navCollapsed=true;render();document.querySelector('[data-action=directory]').focus();return;}
 if(a==='tree-go'){if(state.drawer)hideDirectory();return go(b.dataset.kind,v);}
 if(a==='close-directory')return hideDirectory();
 if(a.startsWith('drawer-')){hideDirectory();return go(a==='drawer-year'?'year':a.slice(7),v);}
 if(a==='close-panel'){state.panel=null;render();return;}
 if(a==='tasks'||a==='versions'||a==='context'){state.panel=a;render();focusPanel();return;}
 if(a==='view-version'){state.viewRev=Number(v);render();announce('正在查看版本 v'+v);return;}
 if(a==='current-version'){state.viewRev=null;render();return;}
 if(a==='select-task'){state.activeTask=Number(v);state.panel='task';const selected=currentTask();if(selected&&['create','adapt','prep','cfu'].includes(selected.kind)&&selected.stage!=='start')state.route={type:'task',unit:5,section:'B',lesson:selected.route.lesson||6,tab:'overview'};render();focusPanel();return;}
 if(a==='revise')return startTask('revise',v);
 if(a==='start-unit'||a==='start-section')return startTask('unit',v);
 if(['create','adapt','prep','cfu'].includes(a)){startTask(a,v);return;}
 if(a.startsWith('ind-')){startTask(a.slice(4),'external',{type:'independent',unit:5,section:'B',lesson:6,tab:'overview'});return;}
 if(a==='submit-year'){
  const text=document.querySelector('#new-instruction').value.trim(),minutes=Number(document.querySelector('#new-minutes').value),conditions=document.querySelector('#new-conditions').value.trim();
  if(!text||minutes<20||minutes>90){state.notice='请填写设计需求，并将每课时长设为 20–90 分钟。';announce(state.notice);render();return;}
  startTask('year','year',{type:'year',unit:5,section:'B',lesson:6,tab:'overview'});const nt=currentTask();nt.history.push(text);nt.conditions=conditions;
  if(text!==nt.seed||minutes!==50||conditions!=='180 课时，其中 160 课时用于常规教学，20 课时留作弹性安排。纸笔、方格纸和投影，无需每名学生配备设备。'){nt.draft=text;nt.message='需求和条件已记录。该组合没有预置结果；静态原型未解释这些输入。';}
  else taskStart(nt);render();return;
 }
 if(a==='save-context'){
  const mins=Number(document.querySelector('#context-minutes').value),notes=document.querySelector('#context-notes').value.trim();
  if(mins<20||mins>90){announce('每课时长须为 20–90 分钟。');document.querySelector('#context-minutes').setCustomValidity('请填写 20–90 分钟');document.querySelector('#context-minutes').reportValidity();return;}
  commit('更新教学条件；材料仍待复核',{contextMinutes:mins,contextNotes:notes,contextChanged:true},['教学条件已更新，现有材料未自动改写']);state.notice='条件已保存为新版本。请核对受影响材料后继续设计。';render();return;
 }
 if(a==='send-task')return submitTask();
 if(a==='fill-sample'&&t){t.draft=t.stage==='prep-try'?prepSample:t.seed;render();document.querySelector('#task-input').focus();return;}
 if(a==='reply-action'&&t){if(t.base!==latest().rev){t.message='当前内容已有新版本。旧回应不能直接采纳，请核对新内容后重新发起相应工作。';render();return;}reply(t,v,b.textContent);t.draft='';render();if(t.status==='waiting'||t.stage==='creation-result'){state.route={type:'task',unit:t.route.unit,section:t.route.section,lesson:t.route.lesson||6,tab:'overview'};render();}return;}
 if(a==='task-origin'&&t){state.viewRev=null;state.route=clone(t.route);if(state.route.type==='new')state.route.type='year';render();return;}
 if(a==='task-result'&&t){state.route={type:'task',unit:t.route.unit,section:t.route.section,lesson:t.route.lesson||6,tab:'overview'};render();return;}
 if(a==='cancel-task'&&t){clearTimeout(t.timer);t.status='cancelled';t.message='已取消本任务，已有内容与回应保留。';render();return;}
 if(a==='stop-task'&&t){clearTimeout(t.timer);t.status='stopped';t.message='执行已停止，当前步骤与内容已保留。';render();return;}
 if(a==='resume-task'&&t&&t.status==='stopped'){t.status='running';t.message='';render();t.timer=setTimeout(t.step,1100);return;}
});
document.querySelector('#directory').addEventListener('click',e=>{if(e.target.id==='directory')hideDirectory();});
document.addEventListener('keydown',e=>{
 if(!state.drawer)return;if(e.key==='Escape'){e.preventDefault();hideDirectory();return;}
 if(e.key==='Tab'){const els=[...document.querySelectorAll('#directory button, #directory summary')].filter(el=>el.getClientRects().length),first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
});

render();
</script>
</body>
</html>
