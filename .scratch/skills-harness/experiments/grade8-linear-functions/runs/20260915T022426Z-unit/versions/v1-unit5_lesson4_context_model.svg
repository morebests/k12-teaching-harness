<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 500" width="100%" height="100%">
  <style>
    .grid-line { stroke: #e5e7eb; stroke-width: 1; stroke-dasharray: 2,2; }
    .axis { stroke: #111827; stroke-width: 2; }
    .line-a { stroke: #111827; stroke-width: 2.5; }
    .line-b { stroke: #4b5563; stroke-width: 2; stroke-dasharray: 5,3; }
    .label { font-family: sans-serif; font-size: 12px; fill: #111827; }
    .axis-title { font-family: sans-serif; font-size: 13px; font-weight: bold; fill: #111827; }
    .point { fill: #111827; }
    .point-b { fill: #4b5563; }
    .intersection-point { fill: #000000; stroke: #111827; stroke-width: 2; }
    .legend-box { fill: #ffffff; stroke: #111827; stroke-width: 1.2; rx: 4; }
    .callout { stroke: #4b5563; stroke-width: 1.2; stroke-dasharray: 3,3; }
  </style>

  <!-- Title -->
  <text x="325" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111827">Package Delivery Cost Comparison</text>

  <!-- Coordinate Grid: w in [0, 14] lbs, C in [0, 45] dollars -->
  <!-- Origin at (80, 440). X scale: 35 px per pound (w=14 at x = 80 + 14*35 = 570) -->
  <!-- Y scale: 8 px per dollar (C=45 at y = 440 - 45*8 = 80) -->

  <!-- Vertical grid lines: w = 2, 4, 6, 8, 10, 12, 14 -->
  <g class="grid-line">
    <line x1="150" y1="60" x2="150" y2="440" />
    <line x1="220" y1="60" x2="220" y2="440" />
    <line x1="290" y1="60" x2="290" y2="440" />
    <line x1="360" y1="60" x2="360" y2="440" />
    <line x1="430" y1="60" x2="430" y2="440" />
    <line x1="500" y1="60" x2="500" y2="440" />
    <line x1="570" y1="60" x2="570" y2="440" />
  </g>

  <!-- Horizontal grid lines: C = 5, 10, 15, 20, 25, 30, 35, 40, 45 -->
  <g class="grid-line">
    <line x1="80" y1="400" x2="580" y2="400" />
    <line x1="80" y1="360" x2="580" y2="360" />
    <line x1="80" y1="320" x2="580" y2="320" />
    <line x1="80" y1="280" x2="580" y2="280" />
    <line x1="80" y1="248" x2="580" y2="248" />
    <line x1="80" y1="200" x2="580" y2="200" />
    <line x1="80" y1="160" x2="580" y2="160" />
    <line x1="80" y1="120" x2="580" y2="120" />
    <line x1="80" y1="80" x2="580" y2="80" />
  </g>

  <!-- Axes -->
  <line x1="80" y1="440" x2="590" y2="440" class="axis" />
  <polyline points="585,436 595,440 585,444" fill="#111827" />
  <line x1="80" y1="440" x2="80" y2="50" class="axis" />
  <polyline points="76,58 80,48 84,58" fill="#111827" />

  <!-- X-Axis Labels -->
  <text x="80" y="458" class="label" text-anchor="middle">0</text>
  <text x="150" y="458" class="label" text-anchor="middle">2</text>
  <text x="220" y="458" class="label" text-anchor="middle">4</text>
  <text x="290" y="458" class="label" text-anchor="middle">6</text>
  <text x="360" y="458" class="label" text-anchor="middle">8</text>
  <text x="430" y="458" class="label" text-anchor="middle">10</text>
  <text x="500" y="458" class="label" text-anchor="middle">12</text>
  <text x="570" y="458" class="label" text-anchor="middle">14</text>
  <text x="325" y="485" class="axis-title" text-anchor="middle">Package Weight w (pounds)</text>

  <!-- Y-Axis Labels -->
  <text x="72" y="404" class="label" text-anchor="end">5</text>
  <text x="72" y="364" class="label" text-anchor="end">10</text>
  <text x="72" y="324" class="label" text-anchor="end">15</text>
  <text x="72" y="284" class="label" text-anchor="end">20</text>
  <text x="72" y="244" class="label" text-anchor="end">25</text>
  <text x="72" y="204" class="label" text-anchor="end">30</text>
  <text x="72" y="164" class="label" text-anchor="end">35</text>
  <text x="72" y="124" class="label" text-anchor="end">40</text>
  <text x="72" y="84" class="label" text-anchor="end">45</text>
  <text x="75" y="38" class="axis-title" text-anchor="start">Total Cost C (dollars)</text>

  <!-- Line Plan A: C = 1.5w + 12 -->
  <!-- At w=0: C=12 -> y = 440 - 12*8 = 344 -->
  <!-- At w=14: C = 1.5(14)+12 = 33 -> y = 440 - 33*8 = 176 -->
  <line x1="80" y1="344" x2="570" y2="176" class="line-a" />

  <!-- Line Plan B: C = 3.0w -->
  <!-- At w=0: C=0 -> y = 440 -->
  <!-- At w=14: C = 3(14) = 42 -> y = 440 - 42*8 = 104 -->
  <line x1="80" y1="440" x2="570" y2="104" class="line-b" />

  <!-- Points Plan A -->
  <circle cx="80" cy="344" r="4.5" class="point" />
  <text x="92" y="340" class="label">(0, 12)</text>
  <circle cx="220" cy="296" r="4.5" class="point" />
  <text x="228" y="290" class="label">(4, 18)</text>
  <circle cx="500" cy="200" r="4.5" class="point" />
  <text x="508" y="196" class="label">(12, 30)</text>

  <!-- Points Plan B -->
  <circle cx="80" cy="440" r="4" class="point-b" />
  <circle cx="220" cy="344" r="4" class="point-b" />
  <text x="228" y="352" class="label">(4, 12)</text>
  <circle cx="500" cy="152" r="4" class="point-b" />
  <text x="508" y="148" class="label">(12, 36)</text>

  <!-- Intersection Point (8, 24) -->
  <!-- x = 80 + 8*35 = 360, y = 440 - 24*8 = 248 -->
  <circle cx="360" cy="248" r="6" class="intersection-point" />
  <line x1="360" y1="248" x2="360" y2="440" class="callout" />
  <line x1="80" y1="248" x2="360" y2="248" class="callout" />
  <text x="370" y="242" class="label" font-weight="bold">Intersection: (8, $24)</text>

  <!-- Legend Box -->
  <g transform="translate(100, 75)">
    <rect width="200" height="85" class="legend-box" />
    <text x="12" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111827">Delivery Options</text>
    <line x1="12" y1="38" x2="45" y2="38" class="line-a" />
    <circle cx="28" cy="38" r="3.5" class="point" />
    <text x="52" y="42" class="label">Plan A: C = 1.50w + 12</text>
    <line x1="12" y1="62" x2="45" y2="62" class="line-b" />
    <circle cx="28" cy="62" r="3.5" class="point-b" />
    <text x="52" y="66" class="label">Plan B: C = 3.00w</text>
  </g>
</svg>