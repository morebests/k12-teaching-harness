<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 500" width="100%" height="100%">
  <style>
    .grid-line { stroke: #e5e7eb; stroke-width: 1; stroke-dasharray: 2,2; }
    .axis { stroke: #111827; stroke-width: 2; }
    .solid-line { stroke: #111827; stroke-width: 2.5; }
    .extrapolate-line { stroke: #4b5563; stroke-width: 2; stroke-dasharray: 4,3; }
    .label { font-family: sans-serif; font-size: 12px; fill: #111827; }
    .axis-title { font-family: sans-serif; font-size: 13px; font-weight: bold; fill: #111827; }
    .point { fill: #111827; }
    .point-intercept { fill: #1f2937; stroke: #111827; stroke-width: 1.5; }
    .callout { stroke: #4b5563; stroke-width: 1.2; stroke-dasharray: 3,3; }
    .info-box { fill: #ffffff; stroke: #111827; stroke-width: 1.2; rx: 4; }
  </style>

  <!-- Title -->
  <text x="325" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#111827">Chemical Cooling in Insulated Flask</text>

  <!-- Coordinate Grid: t in [0, 14] minutes, T in [30, 90] deg C -->
  <!-- Origin at (90, 430) representing t=0, T=30. -->
  <!-- X: 35 px per minute (t=14 at x = 90 + 14*35 = 580) -->
  <!-- Y: 6 px per deg C (T=90 at y = 430 - 60*6 = 70) -->

  <!-- Vertical grid lines: t = 2, 4, 6, 8, 10, 12, 14 -->
  <g class="grid-line">
    <line x1="160" y1="60" x2="160" y2="430" />
    <line x1="230" y1="60" x2="230" y2="430" />
    <line x1="300" y1="60" x2="300" y2="430" />
    <line x1="370" y1="60" x2="370" y2="430" />
    <line x1="440" y1="60" x2="440" y2="430" />
    <line x1="510" y1="60" x2="510" y2="430" />
    <line x1="580" y1="60" x2="580" y2="430" />
  </g>

  <!-- Horizontal grid lines: T = 40, 50, 60, 70, 80, 90 -->
  <g class="grid-line">
    <line x1="90" y1="370" x2="590" y2="370" />
    <line x1="90" y1="310" x2="590" y2="310" />
    <line x1="90" y1="250" x2="590" y2="250" />
    <line x1="90" y1="190" x2="590" y2="190" />
    <line x1="90" y1="130" x2="590" y2="130" />
    <line x1="90" y1="70" x2="590" y2="70" />
  </g>

  <!-- Axes -->
  <line x1="90" y1="430" x2="600" y2="430" class="axis" />
  <polyline points="595,426 605,430 595,434" fill="#111827" />
  <line x1="90" y1="430" x2="90" y2="50" class="axis" />
  <polyline points="86,58 90,48 94,58" fill="#111827" />

  <!-- X-Axis Labels -->
  <text x="90" y="448" class="label" text-anchor="middle">0</text>
  <text x="160" y="448" class="label" text-anchor="middle">2</text>
  <text x="230" y="448" class="label" text-anchor="middle">4</text>
  <text x="300" y="448" class="label" text-anchor="middle">6</text>
  <text x="370" y="448" class="label" text-anchor="middle">8</text>
  <text x="440" y="448" class="label" text-anchor="middle">10</text>
  <text x="510" y="448" class="label" text-anchor="middle">12</text>
  <text x="580" y="448" class="label" text-anchor="middle">14</text>
  <text x="335" y="478" class="axis-title" text-anchor="middle">Time t (minutes)</text>

  <!-- Y-Axis Labels -->
  <text x="82" y="434" class="label" text-anchor="end">30</text>
  <text x="82" y="374" class="label" text-anchor="end">40</text>
  <text x="82" y="314" class="label" text-anchor="end">50</text>
  <text x="82" y="254" class="label" text-anchor="end">60</text>
  <text x="82" y="194" class="label" text-anchor="end">70</text>
  <text x="82" y="134" class="label" text-anchor="end">80</text>
  <text x="82" y="74" class="label" text-anchor="end">90</text>
  <text x="85" y="38" class="axis-title" text-anchor="start">Temperature T (°C)</text>

  <!-- Extrapolation segment from t=0 to t=3 (90, 130) to (195, 184) -->
  <line x1="90" y1="130" x2="195" y2="184" class="extrapolate-line" />

  <!-- Observed line segment from t=3 to t=13 (195, 184) to (545, 364) -->
  <!-- Formula: y = 430 - (T - 30)*6 = 430 - (-3t + 50)*6 = 130 + 18t -->
  <!-- At t=3: x=195, y=184. At t=12: x=510, y=346 -->
  <line x1="195" y1="184" x2="525" y2="354" class="solid-line" />

  <!-- Data Points -->
  <!-- Initial Value Intercept: (0, 80) -> x=90, y=130 -->
  <circle cx="90" cy="130" r="5" class="point-intercept" />
  <text x="105" y="125" class="label" font-weight="bold">Initial Value: (0, 80)</text>

  <!-- (3, 71): x = 90 + 3*35 = 195, y = 430 - (71-30)*6 = 430 - 246 = 184 -->
  <circle cx="195" cy="184" r="4.5" class="point" />
  <text x="205" y="178" class="label">(3, 71)</text>

  <!-- (5, 65): x = 90 + 5*35 = 265, y = 430 - (65-30)*6 = 430 - 210 = 220 -->
  <circle cx="265" cy="220" r="4.5" class="point" />
  <text x="275" y="214" class="label">(5, 65)</text>

  <!-- (8, 56): x = 90 + 8*35 = 370, y = 430 - (56-30)*6 = 430 - 156 = 274 -->
  <circle cx="370" cy="274" r="4.5" class="point" />
  <text x="380" y="268" class="label">(8, 56)</text>

  <!-- (12, 44): x = 90 + 12*35 = 510, y = 430 - (44-30)*6 = 430 - 84 = 346 -->
  <circle cx="510" cy="346" r="4.5" class="point" />
  <text x="520" y="340" class="label">(12, 44)</text>

  <!-- Callout / Explanation Box -->
  <g transform="translate(320, 80)">
    <rect width="250" height="75" class="info-box" />
    <text x="12" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111827">Extrapolation to t = 0</text>
    <text x="12" y="42" font-family="sans-serif" font-size="11" fill="#1f2937">Rate of change m = -3 °C per minute</text>
    <text x="12" y="60" font-family="sans-serif" font-size="11" fill="#1f2937">Stepping back 3 min: 71 + 3(3) = 80 °C</text>
  </g>
</svg>