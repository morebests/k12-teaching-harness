<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 500" width="100%" height="100%">
  <style>
    .grid-line { stroke: #e5e7eb; stroke-width: 1; stroke-dasharray: 2,2; }
    .axis { stroke: #111827; stroke-width: 2; }
    .line { stroke: #1f2937; stroke-width: 2.5; }
    .label { font-family: sans-serif; font-size: 13px; fill: #111827; }
    .axis-title { font-family: sans-serif; font-size: 13px; font-weight: bold; fill: #111827; }
    .point { fill: #111827; }
    .point-label { font-family: sans-serif; font-size: 12px; font-weight: bold; fill: #111827; }
    .callout { stroke: #4b5563; stroke-width: 1.5; stroke-dasharray: 3,3; }
  </style>

  <!-- Title -->
  <text x="325" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">Water Tank Filling Over Time</text>

  <!-- Vertical grid lines: t = 1 to 10 (step 1 hour = 50 px) -->
  <g class="grid-line">
    <line x1="130" y1="60" x2="130" y2="440" />
    <line x1="180" y1="60" x2="180" y2="440" />
    <line x1="230" y1="60" x2="230" y2="440" />
    <line x1="280" y1="60" x2="280" y2="440" />
    <line x1="330" y1="60" x2="330" y2="440" />
    <line x1="380" y1="60" x2="380" y2="440" />
    <line x1="430" y1="60" x2="430" y2="440" />
    <line x1="480" y1="60" x2="480" y2="440" />
    <line x1="530" y1="60" x2="530" y2="440" />
    <line x1="580" y1="60" x2="580" y2="440" />
  </g>

  <!-- Horizontal grid lines: D = 4, 8, 12, 16, 20, 24, 28, 32, 36 (step 4 inches = 40 px) -->
  <g class="grid-line">
    <line x1="80" y1="400" x2="580" y2="400" />
    <line x1="80" y1="360" x2="580" y2="360" />
    <line x1="80" y1="320" x2="580" y2="320" />
    <line x1="80" y1="280" x2="580" y2="280" />
    <line x1="80" y1="240" x2="580" y2="240" />
    <line x1="80" y1="200" x2="580" y2="200" />
    <line x1="80" y1="160" x2="580" y2="160" />
    <line x1="80" y1="120" x2="580" y2="120" />
    <line x1="80" y1="80" x2="580" y2="80" />
  </g>

  <!-- Axes -->
  <line x1="80" y1="440" x2="600" y2="440" class="axis" />
  <polyline points="595,435 605,440 595,445" fill="#111827" />
  <line x1="80" y1="440" x2="80" y2="45" class="axis" />
  <polyline points="75,55 80,45 85,55" fill="#111827" />

  <!-- Tick Labels: X (Time in hours) -->
  <text x="80" y="460" class="label" text-anchor="middle">0</text>
  <text x="130" y="460" class="label" text-anchor="middle">1</text>
  <text x="180" y="460" class="label" text-anchor="middle">2</text>
  <text x="230" y="460" class="label" text-anchor="middle">3</text>
  <text x="280" y="460" class="label" text-anchor="middle">4</text>
  <text x="330" y="460" class="label" text-anchor="middle">5</text>
  <text x="380" y="460" class="label" text-anchor="middle">6</text>
  <text x="430" y="460" class="label" text-anchor="middle">7</text>
  <text x="480" y="460" class="label" text-anchor="middle">8</text>
  <text x="530" y="460" class="label" text-anchor="middle">9</text>
  <text x="580" y="460" class="label" text-anchor="middle">10</text>
  <text x="330" y="488" class="axis-title" text-anchor="middle">Time t (hours)</text>

  <!-- Tick Labels: Y (Depth in inches) -->
  <text x="70" y="404" class="label" text-anchor="end">4</text>
  <text x="70" y="364" class="label" text-anchor="end">8</text>
  <text x="70" y="324" class="label" text-anchor="end">12</text>
  <text x="70" y="284" class="label" text-anchor="end">16</text>
  <text x="70" y="244" class="label" text-anchor="end">20</text>
  <text x="70" y="204" class="label" text-anchor="end">24</text>
  <text x="70" y="164" class="label" text-anchor="end">28</text>
  <text x="70" y="124" class="label" text-anchor="end">32</text>
  <text x="70" y="84" class="label" text-anchor="end">36</text>
  <text x="75" y="35" class="axis-title" text-anchor="start">Water Depth D (inches)</text>

  <!-- The Line: D = 3t + 8. Repaired endpoints: at t=0 -> D=8 (80, 360); at D=36 (t=28/3=9.333) -> (546.7, 80) -->
  <line x1="80" y1="360" x2="546.7" y2="80" class="line" />

  <!-- Marked Observation Points -->
  <!-- (2, 14): x=180, y=300 -->
  <circle cx="180" cy="300" r="4.5" class="point" />
  <line x1="180" y1="300" x2="180" y2="440" class="callout" />
  <line x1="80" y1="300" x2="180" y2="300" class="callout" />
  <text x="190" y="295" class="point-label">(2, 14)</text>

  <!-- (5, 23): x=330, y=210 -->
  <circle cx="330" cy="210" r="4.5" class="point" />
  <line x1="330" y1="210" x2="330" y2="440" class="callout" />
  <line x1="80" y1="210" x2="330" y2="210" class="callout" />
  <text x="340" y="205" class="point-label">(5, 23)</text>

  <!-- Initial Value Point (0, 8) -->
  <circle cx="80" cy="360" r="4.5" class="point" />
  <text x="92" y="365" class="point-label">Initial: (0, 8)</text>
</svg>