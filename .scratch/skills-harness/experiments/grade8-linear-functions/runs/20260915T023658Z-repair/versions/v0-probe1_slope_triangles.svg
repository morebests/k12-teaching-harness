<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 550" width="100%" height="100%">
  <style>
    .grid-line { stroke: #d1d5db; stroke-width: 1; stroke-dasharray: 2,2; }
    .axis { stroke: #111827; stroke-width: 2; }
    .line { stroke: #1f2937; stroke-width: 2.5; }
    .triangle-leg { stroke: #374151; stroke-width: 2; stroke-dasharray: 4,3; }
    .label { font-family: sans-serif; font-size: 13px; fill: #111827; }
    .point { fill: #111827; }
    .point-label { font-family: sans-serif; font-size: 13px; font-weight: bold; fill: #111827; }
    .math-text { font-family: sans-serif; font-size: 12px; fill: #1f2937; }
  </style>

  <!-- Title & Description -->
  <text x="325" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">Slope Invariance via Similar Triangles</text>

  <!-- Coordinate Grid: x in [0, 10], y in [0, 20] -->
  <!-- Origin at (80, 480). Plot width = 500 (50 px per x-unit), plot height = 420 (21 px per y-unit) -->

  <!-- Grid lines -->
  <g class="grid-line">
    <line x1="130" y1="60" x2="130" y2="480" />
    <line x1="180" y1="60" x2="180" y2="480" />
    <line x1="230" y1="60" x2="230" y2="480" />
    <line x1="280" y1="60" x2="280" y2="480" />
    <line x1="330" y1="60" x2="330" y2="480" />
    <line x1="380" y1="60" x2="380" y2="480" />
    <line x1="430" y1="60" x2="430" y2="480" />
    <line x1="480" y1="60" x2="480" y2="480" />
    <line x1="530" y1="60" x2="530" y2="480" />
    <line x1="580" y1="60" x2="580" y2="480" />
  </g>

  <!-- Horizontal grid lines -->
  <g class="grid-line">
    <line x1="80" y1="438" x2="580" y2="438" />
    <line x1="80" y1="396" x2="580" y2="396" />
    <line x1="80" y1="354" x2="580" y2="354" />
    <line x1="80" y1="312" x2="580" y2="312" />
    <line x1="80" y1="270" x2="580" y2="270" />
    <line x1="80" y1="228" x2="580" y2="228" />
    <line x1="80" y1="186" x2="580" y2="186" />
    <line x1="80" y1="144" x2="580" y2="144" />
    <line x1="80" y1="102" x2="580" y2="102" />
    <line x1="80" y1="60" x2="580" y2="60" />
  </g>

  <!-- Axes -->
  <line x1="80" y1="480" x2="600" y2="480" class="axis" />
  <polyline points="595,475 605,480 595,485" fill="#111827" />
  <line x1="80" y1="480" x2="80" y2="45" class="axis" />
  <polyline points="75,55 80,45 85,55" fill="#111827" />

  <!-- Tick Labels -->
  <text x="80" y="500" class="label" text-anchor="middle">0</text>
  <text x="130" y="500" class="label" text-anchor="middle">1</text>
  <text x="180" y="500" class="label" text-anchor="middle">2</text>
  <text x="230" y="500" class="label" text-anchor="middle">3</text>
  <text x="280" y="500" class="label" text-anchor="middle">4</text>
  <text x="330" y="500" class="label" text-anchor="middle">5</text>
  <text x="380" y="500" class="label" text-anchor="middle">6</text>
  <text x="430" y="500" class="label" text-anchor="middle">7</text>
  <text x="480" y="500" class="label" text-anchor="middle">8</text>
  <text x="530" y="500" class="label" text-anchor="middle">9</text>
  <text x="580" y="500" class="label" text-anchor="middle">10</text>
  <text x="600" y="515" class="label" font-weight="bold">x</text>

  <text x="70" y="442" class="label" text-anchor="end">2</text>
  <text x="70" y="400" class="label" text-anchor="end">4</text>
  <text x="70" y="358" class="label" text-anchor="end">6</text>
  <text x="70" y="316" class="label" text-anchor="end">8</text>
  <text x="70" y="274" class="label" text-anchor="end">10</text>
  <text x="70" y="232" class="label" text-anchor="end">12</text>
  <text x="70" y="190" class="label" text-anchor="end">14</text>
  <text x="70" y="148" class="label" text-anchor="end">16</text>
  <text x="70" y="106" class="label" text-anchor="end">18</text>
  <text x="70" y="64" class="label" text-anchor="end">20</text>
  <text x="65" y="45" class="label" font-weight="bold">y</text>

  <!-- Slope Triangles Fill -->
  <polygon points="130,417 280,417 280,291" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <polygon points="280,291 480,291 480,123" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>

  <!-- Triangle Legs -->
  <line x1="130" y1="417" x2="280" y2="417" class="triangle-leg" />
  <line x1="280" y1="417" x2="280" y2="291" class="triangle-leg" />
  <polyline points="268,417 268,405 280,405" fill="none" stroke="#4b5563" stroke-width="1.5" />

  <line x1="280" y1="291" x2="480" y2="291" class="triangle-leg" />
  <line x1="480" y1="291" x2="480" y2="123" class="triangle-leg" />
  <polyline points="468,291 468,279 480,279" fill="none" stroke="#4b5563" stroke-width="1.5" />

  <!-- The Line: y = 2x + 1. Repaired endpoints: at x=0, y=1 -> (80, 459); at y=20, x=9.5 -> (555, 60) -->
  <line x1="80" y1="459" x2="555" y2="60" class="line" />

  <!-- Points and Coordinates -->
  <circle cx="130" cy="417" r="4.5" class="point" />
  <text x="120" y="410" class="point-label" text-anchor="end">A (1, 3)</text>

  <circle cx="280" cy="291" r="4.5" class="point" />
  <text x="270" y="280" class="point-label" text-anchor="end">B (4, 9)</text>

  <circle cx="480" cy="123" r="4.5" class="point" />
  <text x="470" y="115" class="point-label" text-anchor="end">C (8, 17)</text>

  <circle cx="280" cy="417" r="3" fill="#6b7280" />
  <text x="290" y="432" class="math-text">D (4, 3)</text>

  <circle cx="480" cy="291" r="3" fill="#6b7280" />
  <text x="490" y="306" class="math-text">E (8, 9)</text>

  <!-- Leg dimension labels -->
  <text x="205" y="435" class="math-text" text-anchor="middle" font-weight="bold">&#916;x = 3</text>
  <text x="295" y="358" class="math-text" text-anchor="start" font-weight="bold">&#916;y = 6</text>

  <text x="380" y="310" class="math-text" text-anchor="middle" font-weight="bold">&#916;x = 4</text>
  <text x="495" y="210" class="math-text" text-anchor="start" font-weight="bold">&#916;y = 8</text>
</svg>