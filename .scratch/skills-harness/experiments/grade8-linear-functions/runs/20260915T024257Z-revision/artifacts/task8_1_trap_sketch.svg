<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <style>
    .grid-line { stroke: #e5e7eb; stroke-width: 1; stroke-dasharray: 2,2; }
    .axis { stroke: #111827; stroke-width: 2; }
    .line { stroke: #1f2937; stroke-width: 2.5; }
    .triangle-leg { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 4,3; }
    .triangle-fill { fill: #fee2e2; opacity: 0.5; }
    .label { font-family: sans-serif; font-size: 12px; fill: #111827; }
    .axis-title { font-family: sans-serif; font-size: 13px; font-weight: bold; fill: #111827; }
    .title { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #111827; }
    .point { fill: #111827; }
    .math-text { font-family: sans-serif; font-size: 11px; fill: #1f2937; }
    .callout-box { fill: #ffffff; stroke: #dc2626; stroke-width: 1.5; rx: 4; }
    .callout-text { font-family: sans-serif; font-size: 11px; font-weight: bold; fill: #b91c1c; }
  </style>

  <!-- Title -->
  <text x="250" y="25" class="title" text-anchor="middle">The "Counting Grid Squares" Dilemma</text>

  <!-- Vertical Grid Lines (t = 5, 10, 15, 20 hrs; step = 60 px) -->
  <!-- Origin at (70, 310) -->
  <g class="grid-line">
    <line x1="130" y1="60" x2="130" y2="310" />
    <line x1="190" y1="60" x2="190" y2="310" />
    <line x1="250" y1="60" x2="250" y2="310" />
    <line x1="310" y1="60" x2="310" y2="310" />
    <line x1="370" y1="60" x2="370" y2="310" />
  </g>

  <!-- Horizontal Grid Lines (d = 50, 100, 150, 200, 250 miles; step = 50 px) -->
  <g class="grid-line">
    <line x1="70" y1="260" x2="380" y2="260" />
    <line x1="70" y1="210" x2="380" y2="210" />
    <line x1="70" y1="160" x2="380" y2="160" />
    <line x1="70" y1="110" x2="380" y2="110" />
    <line x1="70" y1="60" x2="380" y2="60" />
  </g>

  <!-- Shaded Slope Triangle: from (70, 310) to (130, 310) to (130, 210) -->
  <polygon points="70,310 130,310 130,210" class="triangle-fill" />
  <line x1="70" y1="310" x2="130" y2="310" class="triangle-leg" />
  <line x1="130" y1="310" x2="130" y2="210" class="triangle-leg" />
  <polyline points="120,310 120,300 130,300" fill="none" stroke="#dc2626" stroke-width="1.2" />

  <!-- Triangle Box Count Annotations -->
  <text x="100" y="326" class="math-text" text-anchor="middle" font-weight="bold">1 grid box right</text>
  <text x="136" y="265" class="math-text" text-anchor="start" font-weight="bold">2 grid boxes up</text>

  <!-- Axes -->
  <line x1="70" y1="310" x2="400" y2="310" class="axis" />
  <polyline points="395,306 403,310 395,314" fill="#111827" />
  <line x1="70" y1="310" x2="70" y2="45" class="axis" />
  <polyline points="66,50 70,42 74,50" fill="#111827" />

  <!-- Horizontal Axis Labels -->
  <text x="70" y="328" class="label" text-anchor="middle">0</text>
  <text x="130" y="328" class="label" text-anchor="middle">5</text>
  <text x="190" y="328" class="label" text-anchor="middle">10</text>
  <text x="250" y="328" class="label" text-anchor="middle">15</text>
  <text x="310" y="328" class="label" text-anchor="middle">20</text>
  <text x="235" y="355" class="axis-title" text-anchor="middle">Time (hours)</text>

  <!-- Vertical Axis Labels -->
  <text x="62" y="314" class="label" text-anchor="end">0</text>
  <text x="62" y="264" class="label" text-anchor="end">50</text>
  <text x="62" y="214" class="label" text-anchor="end">100</text>
  <text x="62" y="164" class="label" text-anchor="end">150</text>
  <text x="62" y="114" class="label" text-anchor="end">200</text>
  <text x="62" y="64" class="label" text-anchor="end">250</text>
  <text x="75" y="40" class="axis-title" text-anchor="start">Distance (miles)</text>

  <!-- Line: d = 20t. Passes through (0,0)->(70,310), (5,100)->(130,210), (10,200)->(190,110), (12.5,250)->(220,60) -->
  <line x1="70" y1="310" x2="230" y2="43.3" class="line" />

  <!-- Marked Points -->
  <circle cx="70" cy="310" r="4.5" class="point" />
  <circle cx="130" cy="210" r="4.5" class="point" />
  <circle cx="190" cy="110" r="4.5" class="point" />

  <!-- Student Speech / Thinking Bubble -->
  <rect x="230" y="130" width="220" height="70" class="callout-box" />
  <text x="240" y="150" class="callout-text">Student Claim:</text>
  <text x="240" y="168" class="callout-text">"It goes up 2 boxes &amp; right 1 box,</text>
  <text x="240" y="186" class="callout-text">so the slope must be 2 / 1 = 2 !"</text>
</svg>